<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Nightzgram</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nightzgram">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="manifest" href="./manifest.json">
<style>
:root{
  --tx:#eef1f7;--dim:#8b93a7;--ac:#2f9bff;--gold:#fbbf24;
  --gl:rgba(255,255,255,.08);--gb:rgba(22,25,36,.72);
  --sp:cubic-bezier(.34,1.56,.64,1);color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;width:100%}
body{
  background:#06070b;color:var(--tx);
  font:15px/1.4 "SF Pro Display",Inter,system-ui,"Segoe UI",sans-serif;
  overflow:hidden;overscroll-behavior:none
}
body:before{
  content:"";position:fixed;inset:0;
  background:radial-gradient(500px 400px at 15% 10%,rgba(47,155,255,.22),transparent),
             radial-gradient(500px 400px at 90% 90%,rgba(251,191,36,.14),transparent);
  z-index:-1;pointer-events:none
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,select{
  background:rgba(255,255,255,.06);border:1px solid var(--gl);
  border-radius:12px;padding:10px 12px;outline:0;width:100%;transition:.2s
}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(47,155,255,.2)}
select option{background:#14161f}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

#app{height:100%;height:100dvh;display:flex;overflow:hidden;position:relative}
aside{
  width:min(380px,38vw);min-width:320px;flex:none;display:flex;flex-direction:column;
  background:var(--gb);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:1px solid var(--gl);transition:transform .4s var(--sp)
}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden}

.top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.top h1{flex:1;font-size:19px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:6px}
.cloud-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;flex:none}
.cloud-dot.off{background:#f59e0b;box-shadow:0 0 8px #f59e0b}
.bal{color:var(--gold);font-weight:600;font-size:13px}
.bal-btn{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(251,191,36,.13);border:1px solid rgba(251,191,36,.32);
  color:var(--gold);padding:5px 10px;border-radius:14px;font-weight:700;font-size:12px;
  transition:.2s var(--sp)
}
.bal-btn:hover{background:rgba(251,191,36,.22);transform:scale(1.04)}
.bal-btn:active{transform:scale(.95)}
.pad{padding:0 14px 8px}

/* Stories strip */
.stories{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st-item{display:flex;flex-direction:column;align-items:center;gap:4px;width:62px;flex:none;cursor:pointer;transition:.2s}
.st-item:active{transform:scale(.93)}
.st-ring{position:relative;width:56px;height:56px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,#2f9bff,#a855f7,#fbbf24);display:grid;place-items:center}
.st-ring.seen{background:rgba(255,255,255,.16)}
.st-ring.add{background:rgba(47,155,255,.22);border:1.5px dashed rgba(47,155,255,.65)}
.st-ring .av{border:2px solid #0b0d14}
.st-plus{position:absolute;right:-1px;bottom:-1px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;border:2px solid #0b0d14}
.st-item span{font-size:11px;color:var(--tx);max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}

/* Mini music player bar */
.mplayer{display:flex;align-items:center;gap:10px;padding:7px 14px;background:linear-gradient(90deg,rgba(47,155,255,.2),rgba(168,85,247,.2));border-bottom:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);font-size:12px;z-index:5}
.mplayer .mp-ic{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.mplayer .mp-info{flex:1;min-width:0;cursor:pointer}
.mplayer .mp-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-eq{display:inline-flex;gap:2px;height:12px;align-items:flex-end;margin-right:4px}
.mp-eq i{width:2.5px;background:var(--gold);border-radius:2px;animation:eq .6s infinite alternate}
.mp-eq i:nth-child(2){animation-delay:.2s}.mp-eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{from{height:3px}to{height:12px}}

.tabs{position:relative;display:flex;margin:6px 14px;background:rgba(255,255,255,.05);border-radius:12px}
.tabs button{flex:1;padding:8px 0;font-size:13px;color:var(--dim);z-index:1;transition:.3s}
.tabs button.on{color:#fff}
.ind{position:absolute;top:3px;bottom:3px;width:25%;background:rgba(47,155,255,.35);border-radius:9px;transition:left .45s var(--sp);box-shadow:0 0 14px rgba(47,155,255,.5)}
#list{flex:1;overflow:auto;padding:4px 8px}
.row{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;cursor:pointer;transition:.2s;position:relative}
.row:hover,.row.on{background:rgba(255,255,255,.07)}
.row .m{flex:1;min-width:0}
.row .m b{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row.pinned-bot{background:linear-gradient(90deg,rgba(47,155,255,.11),rgba(168,85,247,.07));border:1px solid rgba(47,155,255,.22);margin-bottom:4px}
.bot-tag{display:inline-flex;align-items:center;padding:1px 6px;border-radius:6px;background:rgba(47,155,255,.22);border:1px solid rgba(47,155,255,.45);color:#7cc4ff;font-size:10px;font-weight:800;letter-spacing:.4px;flex:none}
.v-check{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;flex:none;box-shadow:0 0 8px rgba(56,189,248,.6)}
.v-check svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none}
.sec{color:var(--dim);font-size:12px;padding:8px 10px}
nav{display:flex;border-top:1px solid var(--gl)}
nav button{flex:1;padding:10px 0 8px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;transition:.25s}
nav button.on{color:var(--ac)}
nav button:active{transform:scale(.9)}

.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;object-fit:cover;text-shadow:0 1px 4px #0006}
.ps{display:inline-block;margin-left:3px;color:var(--gold);animation:shim 2.4s infinite}
.ps svg{width:14px;height:14px;fill:var(--gold);vertical-align:-2px}
@keyframes shim{50%{filter:drop-shadow(0 0 6px var(--gold));transform:scale(1.2) rotate(15deg)}}
.es{display:inline-flex;align-items:center;justify-content:center;vertical-align:-3px;margin-left:3px;font-size:15px;line-height:1}
.es img{width:18px;height:18px;border-radius:4px;object-fit:cover;display:block}
.es.st-pulse{animation:stPulse 1.5s ease-in-out infinite}@keyframes stPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.26)}}
.es.st-spin{animation:stSpin 3.2s linear infinite}@keyframes stSpin{to{transform:rotate(360deg)}}
.es.st-glow{animation:stGlow 1.8s ease-in-out infinite}@keyframes stGlow{0%,100%{filter:drop-shadow(0 0 2px #fbbf24)}50%{filter:drop-shadow(0 0 9px #38bdf8) brightness(1.25)}}
.bd{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;vertical-align:-5px;margin-left:3px}
.bd-img{width:100%;height:100%;object-fit:contain;display:block}

.nc-gold{background:linear-gradient(90deg,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.nc-cyber{background:linear-gradient(90deg,#22d3ee,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.nc-ruby{background:linear-gradient(90deg,#fb7185,#e11d48);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.nc-amethyst{background:linear-gradient(90deg,#e879f9,#9333ea);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.nc-emerald{background:linear-gradient(90deg,#34d399,#059669);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.nc-sunset{background:linear-gradient(90deg,#fb923c,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}

.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--gb);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--gl);z-index:4}
.ph h2{flex:1;font-size:17px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:none}
.pg{flex:1;overflow:auto;padding:16px}
#msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;display:flex;flex-direction:column;gap:7px}

/* Pinned message bar */
.pin-bar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:rgba(22,25,38,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--gl);font-size:12px;z-index:3;cursor:pointer;transition:.2s}
.pin-bar:hover{background:rgba(32,37,54,.92)}
.pin-line{width:3px;height:26px;border-radius:3px;background:linear-gradient(180deg,#2f9bff,#fbbf24);flex:none}
.pin-body{flex:1;min-width:0}.pin-body b{display:block;color:var(--ac);font-size:11px}.pin-body span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx);opacity:.9}

/* Message bubbles & swipe-to-reply */
.msg-wrap{display:flex;flex-direction:column;width:100%;position:relative}
.swipe-ic{position:absolute;right:12px;top:50%;transform:translateY(-50%) scale(.4);width:32px;height:32px;border-radius:50%;background:rgba(47,155,255,.28);border:1px solid rgba(47,155,255,.5);color:#fff;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.b{max-width:min(82%,460px);padding:8px 12px;border-radius:18px;background:rgba(255,255,255,.09);align-self:flex-start;cursor:pointer;animation:pop .35s var(--sp);word-wrap:break-word;position:relative;touch-action:pan-y;will-change:transform}
.b.me{align-self:flex-end;background:linear-gradient(135deg,#2f9bff,#1d5fd6)}
.b.hl{box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(251,191,36,.45)}
@keyframes pop{from{transform:scale(.8) translateY(10px);opacity:0}}
.b small{display:block;font-size:11px;opacity:.6;text-align:right;margin-top:2px}
.b img.ph2,.b video.ph2{max-width:100%;max-height:280px;border-radius:12px;display:block;object-fit:cover}
.rp{border-left:3px solid var(--gold);padding-left:8px;font-size:12px;opacity:.85;margin-bottom:4px;background:rgba(0,0,0,.18);border-radius:0 8px 8px 0;padding-top:2px;padding-bottom:2px}
.rx{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rx span{background:rgba(0,0,0,.32);border-radius:10px;padding:1px 7px;font-size:12px;display:inline-flex;align-items:center;gap:2px}
.rx span.rx-prem{border:1px solid rgba(251,191,36,.35);animation:rxBounce 2.2s ease-in-out infinite}
@keyframes rxBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.bot-kb{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bot-kb button{background:rgba(47,155,255,.2);border:1px solid rgba(47,155,255,.45);color:#d8ecff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:11px;transition:.2s var(--sp)}
.bot-kb button:hover{background:rgba(47,155,255,.36);transform:translateY(-1px)}.bot-kb button:active{transform:scale(.95)}

/* Typing indicator */
.typing-row{display:flex;align-items:center;gap:8px;align-self:flex-start;padding:8px 13px;border-radius:18px;background:rgba(255,255,255,.07);font-size:12px;color:var(--dim);animation:pop .3s var(--sp)}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ac);animation:tdot 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}

/* Disappearing media ① */
.ephem-card{position:relative;width:225px;max-width:100%;height:142px;border-radius:14px;overflow:hidden;border:1px solid rgba(251,146,60,.55);background:radial-gradient(circle at 30% 25%,rgba(249,115,22,.35),rgba(15,18,30,.92));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;cursor:pointer;box-shadow:0 6px 22px rgba(249,115,22,.22);transition:.2s}
.ephem-card:hover{transform:scale(1.02);border-color:#fb923c}
.ephem-blur{position:absolute;inset:-12px;background-size:cover;background-position:center;filter:blur(22px) brightness(.55) saturate(1.4);transform:scale(1.15);pointer-events:none}
.ephem-badge{position:relative;z-index:2;display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(251,146,60,.65);color:#fdba74;font-weight:800;font-size:13px;animation:flamePulse 1.4s ease-in-out infinite}
@keyframes flamePulse{0%,100%{transform:scale(1);box-shadow:0 0 8px rgba(249,115,22,.4)}50%{transform:scale(1.07);box-shadow:0 0 18px rgba(249,115,22,.85)}}
.ephem-sub{position:relative;z-index:2;font-size:11px;color:#fff;font-weight:600;text-shadow:0 1px 4px #000}
.ephem-burned{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.06);border:1px dashed rgba(251,146,60,.38);color:#fdba74;font-size:12px;font-style:italic}
.ephem-pill{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;transition:.25s var(--sp);user-select:none}
.ephem-pill.on{background:linear-gradient(135deg,#f97316,#ea580c);border-color:#fdba74;color:#fff;box-shadow:0 0 18px rgba(249,115,22,.75),0 0 32px rgba(234,88,12,.45);transform:scale(1.03)}
.ephem-view{position:fixed;inset:0;z-index:90;background:rgba(5,6,11,.96);backdrop-filter:blur(20px);display:flex;flex-direction:column;padding:14px;animation:fade .2s}
.ephem-prog{height:4px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;margin-bottom:10px}
.ephem-prog i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f97316,#fbbf24);transform-origin:left;transition:transform .08s linear}
.ephem-stage{flex:1;display:grid;place-items:center;overflow:hidden;position:relative}
.ephem-stage img,.ephem-stage video{max-width:100%;max-height:78dvh;border-radius:18px;box-shadow:0 12px 40px #000}

/* Frosted glass context menu */
.ctx-ov{position:fixed;inset:0;z-index:75;background:rgba(4,6,12,.48);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .18s}
.ctx-box{width:min(320px,92vw);display:flex;flex-direction:column;gap:8px;animation:pop .25s var(--sp)}
.ctx-rx{display:flex;justify-content:space-between;gap:4px;padding:7px 10px;border-radius:20px;background:rgba(28,31,44,.88);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px #0009}
.ctx-rx button{font-size:20px;padding:3px 5px;border-radius:10px;transition:.15s}.ctx-rx button:hover{transform:scale(1.25);background:rgba(255,255,255,.1)}
.ctx-menu{border-radius:18px;overflow:hidden;background:rgba(28,31,44,.9);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px #000a}
.ctx-menu button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 15px;font-size:14px;font-weight:500;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;transition:.15s}
.ctx-menu button:last-child{border-bottom:0}.ctx-menu button:hover{background:rgba(255,255,255,.08)}.ctx-menu button.danger{color:#fb7185}

.star-rx-bar{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.star-rx-btn{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:11px;background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.38);color:var(--gold);font-size:11px;font-weight:700;transition:.2s var(--sp)}
.star-rx-btn:hover{background:rgba(251,191,36,.28);transform:scale(1.06)}.star-rx-btn:active{transform:scale(.92)}
.star-rx-cnt{font-size:11px;color:var(--gold);font-weight:700;margin-left:4px}

.comp{display:flex;gap:4px;align-items:center;padding:10px;background:var(--gb);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--gl)}
.comp button{padding:8px;border-radius:50%;color:var(--dim);transition:.25s var(--sp)}
.comp button:hover{color:var(--ac);transform:scale(1.15)}
.comp .snd{background:var(--ac);color:#fff}
.recd{color:#ff5470;animation:shim 1s infinite;padding:0 10px}
.rpb{padding:6px 14px;font-size:12px;background:rgba(255,255,255,.05);display:flex;justify-content:space-between;align-items:center}
.vm{display:flex;align-items:center;gap:8px;min-width:190px}.wf{display:flex;gap:2px;align-items:center;height:26px;flex:1}.wf i{width:3px;background:#fff6;border-radius:2px;transition:.15s}.wf i.on{background:#fff}
.cr{position:relative;width:150px;height:150px;border-radius:50%;cursor:pointer;--p:0}
.cr>video,.cr>.sim{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;object-fit:cover;background:radial-gradient(#2a3a6a,#0b0e1a)}
.cr.big{width:240px;height:240px;margin:0 auto}
.cr svg.rg{position:absolute;inset:0;transform:rotate(-90deg)}.rg circle{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:302;stroke-dashoffset:calc(302 * (1 - var(--p)));stroke-linecap:round}
.sim{display:flex;align-items:center;justify-content:center;gap:4px}.sim i{width:5px;height:20px;background:var(--ac);border-radius:3px;animation:bar 1s infinite ease-in-out}.sim i:nth-child(2n){animation-delay:.2s;background:var(--gold)}.sim i:nth-child(3n){animation-delay:.4s}@keyframes bar{50%{height:60px}}
.cr .t{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;background:#0008;border-radius:8px;padding:0 6px}
.tr-btn{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:3px 9px;border-radius:9px;background:rgba(255,255,255,.14);font-size:11px;font-weight:700;color:#fff;transition:.2s}.tr-btn:hover{background:rgba(255,255,255,.24)}.tr-box{margin-top:6px;padding:6px 9px;border-radius:10px;background:rgba(0,0,0,.28);font-size:12px;line-height:1.35;color:#eef1f7;border-left:2px solid var(--gold)}

/* Profile Hero & 8-NFT Orbit */
.prof-hero{position:relative;border-radius:24px;padding:18px 14px 16px;margin-bottom:12px;text-align:center;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:radial-gradient(circle at 50% 24%,rgba(47,155,255,.2),rgba(14,17,26,.82) 78%)}
.prof-hero .pat{position:absolute;inset:-10%;width:120%;height:120%;pointer-events:none;opacity:.85}
.orbit-box{position:relative;width:254px;height:166px;margin:2px auto 6px;display:grid;place-items:center;z-index:2}
.orbit-av{position:relative;z-index:3;border-radius:50%;padding:3px;background:rgba(255,255,255,.12);box-shadow:0 8px 28px #0009}
.orbit-av.bday-ring{background:linear-gradient(135deg,#fbbf24,#ec4899,#2f9bff);animation:spinHue 4s linear infinite}@keyframes spinHue{to{filter:hue-rotate(360deg)}}
.orb-item{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;transform:translate(var(--ox),var(--oy));z-index:4;cursor:pointer;border-radius:50%;background:rgba(255,255,255,.08);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;animation:orbFloat 3.4s ease-in-out infinite;animation-delay:var(--od,0s);transition:transform .2s}

function openIdb(){
  if(idbPromise)return idbPromise;
  idbPromise=new Promise((resolve,reject)=>{
    try{
      if(!window.indexedDB)return reject(new Error('No IndexedDB'));
      const req=indexedDB.open(IDB_NAME,2);
      req.onupgradeneeded=e=>{
        const d=e.target.result;
        if(!d.objectStoreNames.contains(IDB_STORE))d.createObjectStore(IDB_STORE);
        if(!d.objectStoreNames.contains(STATE_STORE))d.createObjectStore(STATE_STORE);
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    }catch(err){reject(err)}
  });
  return idbPromise;
}
async function idbPut(key,val){

    const d=await openIdb();

      const t=d.transaction(IDB_STORE,'readwrite');
      t.objectStore(IDB_STORE).put(val,key);
      t.oncomplete=res;t.onerror=()=>rej(t.error);
    });

  return 'idb:'+key;

function prettyGiftName(fileName,usedSet){
  const raw=String(fileName||'').replace(/\.png$/i,'').trim();
  const norm=raw.toLowerCase().replace(/[^a-z0-9]/g,'');
  const mapped=GIFT_ID_MAP[raw]||GIFT_ID_MAP[norm];
  if(mapped)return mapped;
  const cleanWords=raw.replace(/[0-9]+/g,' ').replace(/[-_]+/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\s+/g,' ').trim();
  if(cleanWords&&cleanWords.length>=3&&!/^gift$/i.test(cleanWords)){
    const titled=cleanWords.replace(/\b\w/g,c=>c.toUpperCase());
    if(!usedSet||!usedSet.has(titled))return titled;
  }
  const h=Math.abs([...raw].reduce((a,c)=>a*31+c.charCodeAt(0),7));
  for(let step=0;step<COLLECTIBLE_POOL.length*ROMANS.length;step++){
    const base=COLLECTIBLE_POOL[(h+step)%COLLECTIBLE_POOL.length];
    const suf=ROMANS[Math.floor(step/COLLECTIBLE_POOL.length)%ROMANS.length];
    const candidate=base+suf;
    if(!usedSet||!usedSet.has(candidate))return candidate;
  }
  return COLLECTIBLE_POOL[h%COLLECTIBLE_POOL.length];
}

async function pushMessageToCloud(c,m){
  if(!sb||!c||!m)return;
  try{
    const key=c.type==='channel'?'channel:'+c.id:(c.type==='saved'?'saved:'+me:[...c.members].sort().join('__'));
    const recipient=c.type==='dm'?c.members.find(x=>x!==me):null;
    const safeM={...m};
    if(safeM.img&&safeM.img.startsWith('idb:'))safeM.img=mediaSrc(safeM.img)||'';
    if(safeM.video&&safeM.video.startsWith('idb:'))safeM.video='';
    if(safeM.circle&&safeM.circle.url&&safeM.circle.url.startsWith('idb:'))safeM.circle={...safeM.circle,url:''};
    await sb.from('nz_messages').upsert({
      id:m.id,chat_key:key,chat_type:c.type,sender:m.from,recipient,payload:safeM,created_at:m.t
    },{onConflict:'id'});
  }catch(e){}
}
function ingestCloudMessage(row){
  if(!row||!row.payload||!row.id)return false;
  const m=row.payload;
  let c=null;
  if(row.chat_type==='channel'){
    const cid=String(row.chat_key||'').replace('channel:','');
    c=db.chats.find(x=>x.id===cid);
  }else if(row.chat_type==='dm'){
    const parts=String(row.chat_key||'').split('__');
    if(parts.length===2&&(parts.includes(me)||me==='admin')){
      c=chatOf(parts[0],parts[1]);
    }
  }
  if(!c)return false;
  const exIdx=c.msgs.findIndex(x=>x.id===m.id);
  if(exIdx>=0){
    c.msgs[exIdx]=Object.assign(c.msgs[exIdx],m);
  }else{
    c.msgs.push(m);
    c.msgs.sort((a,b)=>(a.t||0)-(b.t||0));
  }
  return true;
}

    }
    const {data:profs,error:pErr}=await sb.from('nz_profiles').select('*').limit(100);
    if(!pErr&&Array.isArray(profs)){
      cloudReady=true;
      profs.forEach(applyCloudProfile);
    }
    const {data:msgs}=await sb.from('nz_messages').select('*').order('created_at',{ascending:true}).limit(300);
    if(Array.isArray(msgs)){
      msgs.forEach(ingestCloudMessage);

    const {data:sts}=await sb.from('nz_stories').select('*').order('created_at',{ascending:false}).limit(40);
    if(Array.isArray(sts)&&sts.length){
      sts.forEach(r=>{
        if(r.payload&&!db.stories.some(s=>s.id===r.id))db.stories.push(r.payload);
      });
    }
    if(cloudReady){
      sb.channel('nz-live')
        .on('postgres_changes',{event:'*',schema:'public',table:'nz_profiles'},pl=>{
          if(pl.new){applyCloudProfile(pl.new);render()}
        })
        .on('postgres_changes',{event:'*',schema:'public',table:'nz_messages'},pl=>{

function stopAudio(){

function toggleTrack(ownerU){
  const u=U(ownerU),tr=u&&u.pinnedTrack;
  if(!tr)return;
  if(ui.player.playing&&ui.player.u===ownerU){stopAudio();render();return}
  stopAudio();
  ui.player={playing:true,u:ownerU};
  const resolvedSrc=mediaSrc(tr.src);
  if(resolvedSrc&&resolvedSrc!=='synth:apnoe'){
    audioEl.src=resolvedSrc;
    audioEl.play().catch(()=>toast('Не удалось воспроизвести файл'));
  }else{
    try{
      audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
      const notes=[261.63,311.13,392.00,466.16,523.25,466.16,392.00,311.13];
      let step=0;
      const playNote=()=>{
        if(!ui.player.playing)return;
        const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
        osc.type='triangle';osc.frequency.value=notes[step%notes.length];
        gain.gain.setValueAtTime(0.06,audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.34);
        osc.connect(gain);gain.connect(audioCtx.destination);
        osc.start();osc.stop(audioCtx.currentTime+0.35);
        step++;
      };
      playNote();
      synthTimer=setInterval(playNote,360);
    }catch(e){}
  }
  render();
}

function syncGiftsWithCdn(files){
  const byId=new Map();
  files.forEach(f=>{
    const raw=f.name.replace(/\.png$/i,'');
    byId.set(raw,f.name);
    byId.set(raw.toLowerCase().replace(/[^a-z0-9]/g,''),f.name);
  });
  const usedUrls=new Set(),namesSet=new Set(db.gifts.map(g=>g.name));
  db.gifts.forEach((g,idx)=>{
    if(g.custom&&g.img)return;
    const wanted=(g.file||FALLBACK_PNG_NAMES[idx%FALLBACK_PNG_NAMES.length]).replace(/\.png$/i,'');
    const matched=byId.get(wanted)||byId.get(wanted.toLowerCase().replace(/[^a-z0-9]/g,''));
    if(matched){g.file=matched;g.img=`${CDN_PNG_BASE}${matched}`}
    else if(!g.img||g.img.startsWith(CDN_PNG_BASE)){const fb=files[idx%files.length].name;g.file=fb;g.img=`${CDN_PNG_BASE}${fb}`}
    if(/\d{4,}/.test(g.name)||/^Gift\s*\d+/i.test(g.name))g.name=prettyGiftName(g.file,namesSet);
    namesSet.add(g.name);usedUrls.add(g.img);
  });
  files.forEach(f=>{
    const url=`${CDN_PNG_BASE}${f.name}`;
    if(usedUrls.has(url)||db.gifts.some(g=>g.img===url))return;
    const id='cdn_'+f.name.replace(/\.png$/i,'').toLowerCase().replace(/[^a-z0-9_-]/g,'_');
    if(db.gifts.some(g=>g.id===id))return;
    const prices=[25,50,75,100,120,150,200,250,300,400];
    const h=[...f.name].reduce((a,c)=>a*31+c.charCodeAt(0),7);
    const title=prettyGiftName(f.name,namesSet);
    namesSet.add(title);
    db.gifts.push({id,name:title,file:f.name,img:url,price:prices[Math.abs(h)%prices.length]});
    usedUrls.add(url);
  });
  save();
  const ae=document.activeElement;
  if(!ae||(ae.tagName!=='INPUT'&&ae.tagName!=='SELECT'))render();
}
async function loadCdnGifts(){
  try{
    const res=await fetch(GH_API_PNG,{headers:{Accept:'application/vnd.github+json'}});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const pngs=Array.isArray(data)?data.filter(f=>f&&f.type==='file'&&/\.png$/i.test(f.name)):[];
    if(!pngs.length)throw new Error('Empty');
    cdnPngUrls=pngs.map(file=>`${CDN_PNG_BASE}${file.name}`);
    syncGiftsWithCdn(pngs);
  }catch(e){
    cdnPngUrls=[...FALLBACK_PNG_URLS];
    syncGiftsWithCdn(FALLBACK_PNG_NAMES.map(name=>({name})));
  }
}

// Pixel disintegration canvas animation on delete
function disintegrateBubble(msgId,done){
  const el=document.querySelector(`.b[data-m="${msgId}"]`);
  if(!el){done();return}
  const r=el.getBoundingClientRect();
  if(r.width<4||r.height<4){done();return}
  const pad=70,cw=Math.ceil(r.width+pad*2),ch=Math.ceil(r.height+pad*2);
  const cv=document.createElement('canvas');
  cv.width=cw;cv.height=ch;
  cv.style.cssText=`position:fixed;left:${r.left-pad}px;top:${r.top-pad}px;width:${cw}px;height:${ch}px;pointer-events:none;z-index:96`;
  document.body.appendChild(cv);
  const ctx=cv.getContext('2d');
  const isMe=el.classList.contains('me');
  const palette=isMe?['#2f9bff','#60a5fa','#93c5fd','#fbbf24','#ffffff']:['#cbd5e1','#94a3b8','#38bdf8','#a855f7','#ffffff'];
  const particles=[];
  const cols=Math.max(18,Math.floor(r.width/5)),rows=Math.max(10,Math.floor(r.height/5));
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      if(particles.length>320&&Math.random()>0.45)continue;
      const px=pad+(x+Math.random())*(r.width/cols);
      const py=pad+(y+Math.random())*(r.height/rows);
      const prog=x/cols;
      particles.push({
        x:px,y:py,
        vx:(Math.random()*2.6+0.6)*(isMe?-1:1)+(Math.random()-0.5)*1.8,
        vy:-Math.random()*2.2-0.3,
        size:Math.random()*2.8+1.4,
        alpha:1,
        delay:prog*12+Math.random()*8,
        col:palette[Math.floor(Math.random()*palette.length)]
      });
    }
  }
  el.style.transition='opacity .28s ease, transform .28s ease';
  el.style.opacity='0';
  el.style.transform='scale(0.94)';
  let frame=0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,cw,ch);
    let alive=0;
    for(const p of particles){
      if(p.alpha<=0)continue;
      alive++;
      if(frame<p.delay){
        ctx.globalAlpha=p.alpha*0.85;
        ctx.fillStyle=p.col;
        ctx.fillRect(p.x,p.y,p.size,p.size);
        continue;
      }
      p.x+=p.vx;p.y+=p.vy;p.vy-=0.03;p.vx*=1.015;p.alpha-=0.026;
      if(p.alpha>0){
        ctx.globalAlpha=p.alpha;
        ctx.fillStyle=p.col;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size*0.65,0,Math.PI*2);ctx.fill();
      }
    }
    if(alive>0&&frame<65)requestAnimationFrame(tick);
    else{cv.remove();done()}
  }
  requestAnimationFrame(tick);
}

// Disappearing media ① viewer & cleanup
let ephemTimer=null;
function openEphemViewer(chatId,msgId){
  const c=db.chats.find(x=>x.id===chatId);if(!c)return;
  const m=c.msgs.find(x=>x.id===msgId);if(!m||!m.ephem||m.burned)return;
  const ep=m.ephem,src=mediaSrc(ep.src)||ep.src;
  const dur=ep.kind==='video'||ep.kind==='circle'?12:7;
  const burnNow=()=>{
    if(ephemTimer){clearInterval(ephemTimer);ephemTimer=null}
    const ov=$('#ephem-ov');if(ov)ov.remove();
    if(ep.src&&ep.src.startsWith('idb:'))idbDel(ep.src);
    const label=ep.kind==='video'?'Видео':(ep.kind==='circle'?'Кружочек':'Фото');
    m.burned=label;delete m.ephem;
    save();render();pushMessageToCloud(c,m);
    const bEl=document.querySelector(`.b[data-m="${msgId}"]`);
    if(bEl)sparks(bEl);
    toast(`🔥 ${label} сгорело и удалено из памяти`);
  };
  const bodyHtml=ep.kind==='video'
    ?`<video src="${src}" autoplay playsinline controls></video>`
    :(ep.kind==='circle'
      ?(src?`<div class="cr big" style="--p:1"><video src="${src}" autoplay playsinline loop></video>${ring()}</div>`:`<div class="cr big" style="--p:1"><div class="sim"><i></i><i></i><i></i><i></i><i></i></div>${ring()}</div>`)
      :`<img src="${src}" alt="Исчезающее фото">`);
  const ov=document.createElement('div');
  ov.id='ephem-ov';ov.className='ephem-view';
  ov.innerHTML=`<div class="ephem-prog"><i id="ephem-bar"></i></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <span style="font-size:13px;font-weight:700;color:#fdba74">🔥 Исчезающее медиа ① · после закрытия сгорит</span>
    <button class="btn g sm" id="ephem-close" style="margin:0">✕ Закрыть</button>
  </div>
  <div class="ephem-stage">${bodyHtml}</div>`;
  document.body.appendChild(ov);
  $('#ephem-close').onclick=burnNow;
  ov.onclick=e=>{if(e.target===ov)burnNow()};
  const t0=Date.now();
  ephemTimer=setInterval(()=>{
    const p=Math.min(1,(Date.now()-t0)/(dur*1000));
    const bar=$('#ephem-bar');if(bar)bar.style.transform=`scaleX(${1-p})`;
    if(p>=1)burnNow();
  },60);
}

function triggerPeerReply(chat,sentMsg){
  if(!chat||chat.type!=='dm')return;
  const otherId=chat.members.find(x=>x!==me);
  if(!otherId||otherId===me)return;
  const other=U(otherId),isBot=otherId===BOT_ID;
  if(isBot){
    sentMsg.react=sentMsg.react||{};
    const rx=sentMsg.circle||sentMsg.img||sentMsg.video?'🔥':(sentMsg.gift?'❤️':'👍');
    sentMsg.react[rx]=sentMsg.react[rx]||[];
    if(!sentMsg.react[rx].includes(BOT_ID))sentMsg.react[rx].push(BOT_ID);
  }
  ui.typing[chat.id]=otherId;render();
  setTimeout(()=>{
    delete ui.typing[chat.id];

      const ans=generateBotReply(sentMsg);

    }else{
      const low=(sentMsg.text||'').toLowerCase();

      else if(sentMsg.circle)rep='Крутой кружочек! 🔥 Отличное качество!';

      else if(low.includes('nft')||low.includes('подар'))rep='Да, коллекционные NFT с орбитой вокруг аватарки вообще пушка! На маркете сейчас много редких лотов.';

          'Интересная мысль! Кстати, загляни в мой профиль — я там трек и NFT обновил.',

// Birthday & work hours helpers
function formatBirthday(bday){
  if(!bday)return null;
  const parts=bday.split('-').map(Number);
  if(parts.length!==3||!parts[0])return null;
  const [y,m,d]=parts;
  const months=['янв.','февр.','мар.','апр.','мая','июн.','июл.','авг.','сент.','окт.','нояб.','дек.'];
  const now=new Date();
  let age=now.getFullYear()-y;
  if(now.getMonth()+1<m||(now.getMonth()+1===m&&now.getDate()<d))age--;
  const isToday=(now.getMonth()+1===m&&now.getDate()===d);
  return{text:`${String(d).padStart(2,'0')} ${months[m-1]||''} ${y} (${Math.max(0,age)} лет)`,isToday};
}
function workHoursStatus(wh){
  if(!wh||!wh.enabled)return null;
  const now=new Date(),day=now.getDay();
  const [fh,fm]=(wh.from||'09:00').split(':').map(Number);
  const [th,tm]=(wh.to||'18:00').split(':').map(Number);
  const cur=now.getHours()*60+now.getMinutes(),start=fh*60+(fm||0),end=th*60+(tm||0);
  const isWorkDay=(wh.days||[]).includes(day);
  const isOpen=isWorkDay&&(end>start?(cur>=start&&cur<end):(cur>=start||cur<end));
  return isOpen?{open:true,label:`Открыто до ${wh.to}`}:{open:false,label:'Выходной'};
}

function msg(m,c){
  const me_=m.from===me,isPremMe=prem(U(me));let b='';
  if(m.reply){const r=c.msgs.find(x=>x.id===m.reply);if(r)b+=`<div class="rp">${esc(prv(r))}</div>`}
  if(c.type==='channel')b+=`<b style="color:var(--gold)">${esc(c.name)}</b><br>`;
  if(m.fwd)b+=`<div class="rp">Переслано от @${esc(m.fwd)}</div>`;
  if(m.text)b+=esc(m.text).replace(/\n/g,'<br>');
  if(m.burned){
    b+=`<div class="ephem-burned">🔥 ${esc(m.burned)} сгорело и недоступно для повторного просмотра</div>`;
  }else if(m.ephem){
    const ep=m.ephem,src=mediaSrc(ep.src)||ep.src;
    const kindLbl=ep.kind==='video'?'Исчезающее видео':(ep.kind==='circle'?'Исчезающий кружочек':'Исчезающее фото');
    const bgStyle=ep.kind==='img'&&src?`style="background-image:url('${esc(src)}')"`:'';
    b+=`<div class="ephem-card" data-a="openephem" data-m="${m.id}">
      <div class="ephem-blur" ${bgStyle}></div>
      <div class="ephem-badge">🔥 ①</div>
      <div class="ephem-sub">${kindLbl} • Нажмите для просмотра</div>
    </div>`;
  }else{
    if(m.img){const imSrc=mediaSrc(m.img);if(imSrc)b+=`<img class="ph2" src="${imSrc}">`}
    if(m.video){const vdSrc=mediaSrc(m.video);if(vdSrc)b+=`<video class="ph2" src="${vdSrc}" controls playsinline></video>`}
    if(m.voice){
      const trText=m.voice.transcript||m.transcript||'Не удалось распознать речь';
      b+=`<div class="vm" data-a="playv" data-m="${m.id}"><span>▶</span><div class="wf">${m.voice.bars.map(h=>`<i style="height:${h}px"></i>`).join('')}</div><span>${m.voice.sec}с</span></div>
      <div><button class="tr-btn" data-a="transcribe" data-m="${m.id}">→A${isPremMe?'':' ★'}</button></div>
      ${ui.openTr[m.id]?`<div class="tr-box">${esc(trText)}</div>`:''}`;
    }
    if(m.circle){
      const trText=m.circle.transcript||m.transcript||'Не удалось распознать речь';
      const cUrl=mediaSrc(m.circle.url);
      b+=`<div class="cr" data-a="playc" data-m="${m.id}">${cUrl?`<video src="${cUrl}" playsinline></video>`:'<div class="sim"><i></i><i></i><i></i><i></i><i></i></div>'}${ring()}<span class="t">${m.circle.sec}с</span></div>
      <div><button class="tr-btn" data-a="transcribe" data-m="${m.id}">→A${isPremMe?'':' ★'}</button></div>
      ${ui.openTr[m.id]?`<div class="tr-box">${esc(trText)}</div>`:''}`;
    }
  }
  if(m.gift){const o=m.gift;b+=`<div style="width:136px" data-a="item" data-o="${o.owner}" data-i="${o.id}">${card(o.snap,0)}</div>🎁 Подарок`}
  if(Array.isArray(m.buttons)&&m.buttons.length){
    b+=`<div class="bot-kb">${m.buttons.map(bt=>`<button data-a="botbtn" data-txt="${esc(bt)}">${esc(bt)}</button>`).join('')}</div>`;
  }
  if(c.type==='channel'){
    b+=`<div class="star-rx-bar">
      ${[10,50,100].map(amt=>`<button class="star-rx-btn" data-a="starrx" data-c="${c.id}" data-m="${m.id}" data-amt="${amt}">★ +${amt}</button>`).join('')}
      <span class="star-rx-cnt">★ ${fmtNum(m.starRx||0)}</span>
    </div>`;
  }
  const rx=Object.entries(m.react||{}).filter(r=>r[1].length);
  return `<div class="msg-wrap" data-wrap="${m.id}">
    <div class="swipe-ic">↩</div>
    <div class="b ${me_?'me':''}" data-a="ctxmsg" data-m="${m.id}">${b}${rx.length?`<div class="rx">${rx.map(r=>{const hasPrem=r[1].some(uname=>prem(U(uname)));return `<span class="${hasPrem?'rx-prem':''}">${r[0]} ${r[1].length}</span>`}).join('')}</div>`:''}<small>${c.pinnedId===m.id?'📌 ':''}${m.edited?'изм. · ':''}${ago(m.t)}</small></div>
  </div>`;
}
const ring=()=>'<svg class="rg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/></svg>';

function openMsgContextMenu(msgId){
  const c=db.chats.find(x=>x.id===ui.chat);if(!c)return;
  const m=c.msgs.find(x=>x.id===msgId);if(!m)return;
  const isPremMe=prem(U(me));
  const reactPalette=isPremMe?['👍','❤️','🔥','😂','🤩','💎','⚡','👑']:['👍','❤️','🔥','😂'];
  const isPinned=c.pinnedId===m.id;
  const canEdit=m.from===me&&!!m.text&&!m.burned;
  const ov=document.createElement('div');
  ov.id='ctx-ov';ov.className='ctx-ov';
  ov.innerHTML=`<div class="ctx-box">
    <div class="ctx-rx">${reactPalette.map(e=>`<button data-cact="react" data-e="${e}">${e}</button>`).join('')}</div>
    <div class="ctx-menu">
      <button data-cact="reply"><span>↩ Ответить</span><span>↩</span></button>
      <button data-cact="pin"><span>${isPinned?'📌 Открепить из шапки':'📌 Закрепить в шапке чата'}</span><span>📌</span></button>
      ${canEdit?`<button data-cact="edit"><span>✏️ Изменить</span><span>✏️</span></button>`:''}
      <button data-cact="fwd"><span>➦ Переслать</span><span>➦</span></button>
      <button class="danger" data-cact="del"><span>🗑️ Удалить</span><span>🗑️</span></button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const closeCtx=()=>{const el=$('#ctx-ov');if(el)el.remove()};
  ov.onclick=ev=>{
    if(ev.target===ov)return closeCtx();
    const btn=ev.target.closest('[data-cact]');if(!btn)return;
    const ca=btn.dataset.cact;
    closeCtx();
    if(ca==='react')act('react',{m:m.id,e:btn.dataset.e},ev);
    else if(ca==='reply'){ui.reply=m.id;ui.editMsg=null;render();setTimeout(()=>{const i=$('#mi');if(i)i.focus()},40)}
    else if(ca==='pin'){c.pinnedId=isPinned?null:m.id;save();render();toast(isPinned?'Откреплено':'Закреплено в шапке чата')}
    else if(ca==='edit'){ui.editMsg=m.id;ui.reply=null;ui.draft=m.text||'';render();setTimeout(()=>{const i=$('#mi');if(i)i.focus()},40)}
    else if(ca==='fwd')act('fwd',{m:m.id},ev);
    else if(ca==='del'){
      disintegrateBubble(m.id,()=>{
        c.msgs=c.msgs.filter(x=>x.id!==m.id);
        if(c.pinnedId===m.id)c.pinnedId=null;
        save();render();
        if(sb)sb.from('nz_messages').delete().eq('id',m.id).then(()=>{});
      });
    }
  };
}

function sendMsg(x){
  const c=db.chats.find(c=>c.id===ui.chat);if(!c)return;
  if(ui.editMsg&&x.text){
    const target=c.msgs.find(m=>m.id===ui.editMsg);
    if(target){target.text=x.text;target.edited=true;ui.editMsg=null;ui.draft='';save();render();pushMessageToCloud(c,target);return}
  }
  const m=Object.assign({id:uid(),from:me,t:Date.now()},x);
  if(ui.reply){m.reply=ui.reply;ui.reply=null}
  c.msgs.push(m);ui.draft='';save();render();
  pushMessageToCloud(c,m);
  if(c.type==='dm')triggerPeerReply(c,m);
}

function createSpeechSession(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  try{
    const rec=new SR();
    rec.lang='ru-RU';rec.interimResults=true;rec.continuous=true;
    let finalTxt='',interimTxt='';
    rec.onresult=e=>{
      finalTxt='';interimTxt='';
      for(let i=0;i<e.results.length;i++){
        const r=e.results[i];
        if(r.isFinal)finalTxt+=r[0].transcript+' ';
        else interimTxt+=r[0].transcript;
      }
    };
    rec.onerror=()=>{};rec.start();
    return{stop:()=>{try{rec.stop()}catch(e){}return(finalTxt+' '+interimTxt).replace(/\s+/g,' ').trim()||'Не удалось распознать речь'}};
  }catch(e){return null}
}

  save();shut();toast('Часы работы сохранены');break;
}
case'offhours':{if(me_.workHours)me_.workHours.enabled=false;save();shut();toast('Часы работы скрыты');break}
case'bonus':me_.stars+=100;save();toast('+100 ★');break;
case'ava':$('#file').dataset.t='ava';$('#file').accept='image/*';$('#file').click();return;
case'atab':ui.at=d.t;break;
case'agivestar':{
  if(me!=='admin')return toast('Доступ запрещён');
  const uname=normUser(val('au')),u=db.users[uname],st=+d.st||0;
  if(!u)return toast('Пользователь @'+uname+' не найден');
  u.stars+=st;tx(['admin',u.u],`Админ выдал +${fmtNum(st)} ★ пользователю @${u.u}`);save();toast(`Выдано +${fmtNum(st)} ★ для @${u.u}`);break;
}
case'apass':{
  if(me!=='admin')return toast('Доступ запрещён');
  const uname=normUser(val('ap-u')),u=db.users[uname],p=val('ap').trim();
  if(!u)return toast('Пользователь не найден');
  if(p.length<3)return toast('Пароль должен быть не короче 3 символов');
  u.pw=p;save();toast(`Пароль для @${u.u} успешно изменён`);return;
}
case'abal':{
  if(me!=='admin')return toast('Доступ запрещён');
  const uname=normUser(val('au')),u=db.users[uname];
  if(!u)return toast('Пользователь не найден');
  u.stars+=+val('as')||0;u.rub+=+val('ar')||0;save();toast('Баланс @'+u.u+' обновлён');break;
}
case'aprem':{
  if(me!=='admin')return toast('Доступ запрещён');
  const uname=normUser(val('aprem-u')),u=db.users[uname],n=+d.d||30;
  if(!u)return toast('Пользователь не найден');
  if(u.u==='admin')return toast('У админа Premium уже активен навсегда');
  u.prem=Math.max(u.prem,Date.now())+n*864e5;
  tx(['admin',u.u],`Админ выдал Premium (${n} дн.) @${u.u}`);save();toast(`Premium (+${n} дн.) выдан @${u.u}`);break;
}
case'aunprem':{
  if(me!=='admin')return toast('Доступ запрещён');
  const uname=normUser(val('aprem-u')),u=db.users[uname];
  if(!u)return toast('Пользователь не найден');
  if(u.u==='admin')return toast('Нельзя забрать вечный Premium у администратора');
  u.prem=0;save();toast('Premium снят у @'+u.u);break;
}
case'anft':{
  if(me!=='admin')return toast('Доступ запрещён');
  const u=U(val('nu')),n=Math.min(9999,Math.max(1,+val('nn')||1+Math.floor(Math.random()*9999)));
  u.items.push(mkNft({id:uid(),gid:val('ng')},val('nm'),val('nb'),val('np'),n));
  tx([u.u],`Админ выдал NFT #${n} @${u.u}`);save();toast('NFT выдан @'+u.u);break;
}
case'agift':{
  if(me!=='admin')return toast('Доступ запрещён');
  const n=val('gn').trim();if(!n)return toast('Укажите название');
  const f=$('#gi').files[0],add=async(img,custom)=>{
    const f0=FALLBACK_PNG_NAMES[db.gifts.length%FALLBACK_PNG_NAMES.length];
    const ref=img?await idbPut('gift_'+uid(),img):(CDN_PNG_BASE+f0);
    db.gifts.push({id:'g'+uid(),name:n,file:f0,img:ref,custom:!!custom,price:Math.max(1,+val('gp')||100)});
    save();toast('Подарок добавлен');render();
  };
  if(f){const r=new FileReader();r.onload=()=>add(r.result,true);r.readAsDataURL(f);return}
  add(null,false);return;
}
default:return}
render()}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(a==='filt'&&t.tagName!=='SELECT'&&t.tagName!=='INPUT')return;if(a==='filt')return;act(a,t.dataset,e)});
document.addEventListener('change',e=>{
  if(e.target.dataset.a==='filt')act('filt',{},e);
  if(['nu','ng','nm','nb','np'].includes(e.target.id))syncAdminPreview();
  if(e.target.id==='es-anim'&&U(me)&&U(me).emojiStatus){U(me).emojiStatus.anim=e.target.value;save();render()}
  if(e.target.id==='afile'){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=async()=>{
      const artist=(($('#tr-art')||{}).value||'').trim()||'Мой трек';
      const title=(($('#tr-tit')||{}).value||'').trim()||f.name.replace(/\.[^.]+$/,'');
      const ref=await idbPut('track_'+me+'_'+uid(),r.result);
      U(me).pinnedTrack={artist,title,src:ref};
      save();shut();render();toast('Аудиофайл закреплён в профиле 🎵');
    };
    r.readAsDataURL(f);e.target.value='';
  }
  if(e.target.id==='file'){
    const f=e.target.files[0];if(!f)return;
    const mode=e.target.dataset.t;
    const isVideo=f.type&&f.type.startsWith('video/');
    const r=new FileReader();
    r.onload=async()=>{
      if(mode==='estatus'){
        const anim=($('#es-anim')||{}).value||'pulse';
        const ref=await idbPut('estatus_'+me+'_'+uid(),r.result);
        U(me).emojiStatus={type:'img',val:ref,anim};
        e.target.dataset.t='';save();shut();render();toast('Картинка-статус установлена');
        return;
      }
      if(isVideo){
        const ref=await idbPut('vid_'+uid(),r.result);
        e.target.dataset.t='';
        openMediaPreview('video',ref,r.result);
        return;
      }
      const im=new Image();
      im.onload=async()=>{
        const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const url=c.toDataURL('image/jpeg',.76);
        if(mode==='ava'){
          const ref=await idbPut('ava_'+me+'_'+uid(),url);
          U(me).photo=ref;e.target.dataset.t='';save();render();toast('Фото профиля обновлено');
        }else if(mode==='storyimg'){
          const ref=await idbPut('story_'+uid(),url);
          ui.storyDraft=Object.assign(ui.storyDraft||{},{img:ref});
          e.target.dataset.t='';storyCreatorModal();
        }else{
          const ref=await idbPut('img_'+uid(),url);
          e.target.dataset.t='';
          openMediaPreview('img',ref,url);
        }
      };
      im.src=r.result;
    };
    r.readAsDataURL(f);e.target.value='';
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;$('#list').innerHTML=list()}
  if(e.target.id==='mi')ui.draft=e.target.value;
  if(e.target.id==='nn')syncAdminPreview();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='mi')act('send',{},e);
  if(e.key==='Enter'&&(e.target.id==='lp'))act('login',{},e);
  if(e.key==='Enter'&&(e.target.id==='re-pass'))act('regemail',{},e);
});
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('.tile');document.querySelectorAll('.tile').forEach(x=>{if(x!==t)x.style.transform=''});if(t){const r=t.getBoundingClientRect();t.style.transform=`perspective(600px) rotateY(${((e.clientX-r.left)/r.width-.5)*22}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*22}deg) scale(1.06)`}});

// Swipe left on message to reply + swipe back on mobile
let sx=0,sy=0,swB=null,swWrap=null,swDx=0;
document.addEventListener('touchstart',e=>{
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;swDx=0;
  swB=e.target.closest&&e.target.closest('.b');
  swWrap=swB?swB.closest('.msg-wrap'):null;
  if(swB)swB.style.transition='none';
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!swB)return;
  const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
  if(Math.abs(dy)>28&&Math.abs(dx)<20){swB.style.transform='';swB=null;return}
  if(dx<-8){
    swDx=Math.max(-72,dx);
    swB.style.transform=`translateX(${swDx}px)`;
    const icEl=swWrap&&swWrap.querySelector('.swipe-ic');
    if(icEl){
      const p=Math.min(1,Math.abs(swDx)/52);
      icEl.style.opacity=p;
      icEl.style.transform=`translateY(-50%) scale(${0.4+p*0.65})`;
    }
  }
},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(swB){
    const mId=swB.dataset.m;
    swB.style.transition='transform .25s var(--sp)';
    swB.style.transform='';
    const icEl=swWrap&&swWrap.querySelector('.swipe-ic');
    if(icEl){icEl.style.opacity='0';icEl.style.transform='translateY(-50%) scale(.4)'}
    if(swDx<=-48&&mId){
      ui.reply=mId;ui.editMsg=null;render();
      setTimeout(()=>{const i=$('#mi');if(i)i.focus()},40);
    }
    swB=null;swWrap=null;swDx=0;
    return;
  }
  if(me&&(ui.chat||ui.page)&&dx>90&&Math.abs(dy)<60&&sx<80){ui.chat=ui.page=null;render()}
});

// Boot synchronously so preview renders immediately without hanging on IndexedDB/network
registerPwa();
render();
(async function hydrateAsync(){
  try{
    const savedDb=await idbLoadState();
    if(savedDb&&typeof savedDb==='object'&&savedDb.users){
      db=savedDb;
      ensureDefaults();
      if(me&&!db.users[me])me=null;
      render();
    }
    await hydrateMediaCache();
    loadCdnGifts();
    initCloud();
  }catch(e){
    loadCdnGifts();
  }
})();
</script>
